<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Lu | AI Design - Liquid Portfolio</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=JetBrains+Mono&display=swap');

        body {
            background: linear-gradient(180deg, #fafafa 0%, #f0f4f8 100%);
            font-family: 'Inter', sans-serif;
            color: #1a1a1a;
            margin: 0; padding: 0;
            overflow-x: hidden;
            cursor: crosshair; /* Specialized cursor for a "fluid" feel */
        }

        /* ── Water Floating Animation ── */
        @keyframes waterFloat {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            25%  { transform: translate(6px, -18px) rotate(1.2deg) scale(1.008); }
            50%  { transform: translate(-4px, -28px) rotate(-0.8deg) scale(1.012); }
            75%  { transform: translate(-8px, -14px) rotate(0.6deg) scale(1.006); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        .water-item {
            animation: waterFloat 6s ease-in-out infinite;
            will-change: transform;
        }

        .water-item:nth-child(2) {
            animation-duration: 7s;
            animation-delay: -2.5s;
        }

        .water-item:nth-child(3) {
            animation-duration: 6.5s;
            animation-delay: -4.5s;
        }

        /* ── Card Styling ── */
        .ai-card {
            transition: transform .6s cubic-bezier(.16,1,.3,1), box-shadow .6s ease;
        }
        
        .ai-card:hover {
            transform: scale(1.02) translateY(-10px) !important;
            animation-play-state: paused; /* Stop floating when hovering */
            z-index: 10;
        }

        .tag-pill {
            font-size: 9px; font-weight: 400;
            color: #6b7280; border: 1px solid #e5e7eb;
            padding: 4px 12px; border-radius: 999px;
            text-transform: uppercase; letter-spacing: .1em;
            background: white;
        }

        /* ── Fade In ── */
        .page-wrap { opacity: 0; animation: fadeIn .8s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

        .shimmer {
            background: #f0f0f0;
            background-image: linear-gradient(to right, #f0f0f0 0%, #e8e8e8 20%, #f0f0f0 40%, #f0f0f0 100%);
            background-size: 800px 100%;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useEffect } = React;

    // --- NAVIGATION COMPONENT (Imported from index.html) ---
    function NavBar() {
        return (
            <nav className="w-full flex items-center justify-between px-6 py-8 md:px-12 bg-[#fafafa]/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-100">
                <div className="flex flex-col">
                    <span className="text-[15px] font-bold tracking-[0.05em] text-[#1a1a1a] uppercase">Yi Lu</span>
                    <span className="text-[11px] font-light tracking-[0.1em] text-[#9ca3af] uppercase mt-1">Designer & Researcher</span>
                </div>

                <div className="hidden md:flex items-center space-x-12 absolute left-1/2 transform -translate-x-1/2">
                    {['Work', 'AI Design', 'About'].map((item) => (
                        <a
                            key={item}
                            href={item === 'About' ? 'about.html' : item === 'AI Design' ? 'aidesign.html' : `index.html#${item.toLowerCase()}`}
                            className={`text-[13px] font-light tracking-[0.08em] transition-colors duration-300 uppercase ${item === 'AI Design' ? 'text-[#1a1a1a]' : 'text-[#9ca3af] hover:text-[#1a1a1a]'}`}
                        >
                            {item}
                        </a>
                    ))}
                </div>

                <div className="flex items-center space-x-6">
                    <a href="https://www.linkedin.com/in/yi-lu-b014b31a7/" className="text-[#9ca3af] hover:text-[#1a1a1a] transition-colors duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                    </a>
                    <a href="mailto:yi@example.com" className="text-[#9ca3af] hover:text-[#1a1a1a] transition-colors duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
                    </a>
                </div>
            </nav>
        );
    }

    function App() {
        const projects = [
            {
                title: "Froggy Drawing",
                subtitle: "Non-touch Interaction Design",
                tools: ["Gemini", "React", "AI Agent"],
                tag: "Live · 2026",
                type: "Interaction",
                media: "https://images.squarespace-cdn.com/content/v1/68d5a437b484267b9999188c/7c517aee-177d-4956-8232-81a06acc56c3/product-fog-demo.gif",
                href: "https://yil114.github.io/fog-project"
            },
            {
                title: "金鱼池塘 (Goldfish Pond)",
                subtitle: "Multimodal AI Experience",
                tools: ["Claude Design", "ChatGPT"],
                tag: "Live · 2026",
                type: "Zero UI",
                media: null,
                href: "https://yil114.github.io/pond-goldfish-interaction/"
            },
            {
                title: "The Last Stop",
                subtitle: "Spatial Memory & Urban Closure",
                tools: ["Design Research", "UX Strategy"],
                tag: "Project · 2026",
                type: "Product Strategy",
                media: null
            }
        ];

        return (
            <div className="page-wrap min-h-screen flex flex-col">
                <NavBar />

                {/* Main Content */}
                <main className="flex-grow px-8 py-20 md:px-16">
                    <header className="max-w-[1400px] mx-auto mb-24">
                        <h1 className="text-4xl md:text-5xl font-light tracking-tight text-[#1a1a1a]">AI Design Playground.</h1>
                        <p className="text-gray-400 mt-4 max-w-lg font-light leading-relaxed">
                            I have been playing with AI lately, exploring how it can be used to create new forms of design and interaction. 
                            This page is a collection of my experiments and projects in the AI design space, where I push the boundaries of what's possible with AI and design. 
                        </p>
                    </header>

                    {/* Fluid Grid */}
                    <div className="max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-12 md:gap-20">
                        {projects.map((p, i) => (
                            <div key={i} className="water-item">
                                <ProjectCard p={p} />
                            </div>
                        ))}
                    </div>
                </main>

                <footer className="py-20 flex flex-col items-center border-t border-gray-100">
                    <span className="text-[10px] uppercase tracking-[0.3em] text-gray-300">End of Line</span>
                </footer>
            </div>
        );
    }

    function ProjectCard({ p }) {
        return (
            <div className="ai-card group">
                <a href={p.href || "#"} className={!p.href ? "cursor-default" : ""}>
                    <div className="w-full aspect-[4/3] bg-white border border-gray-100 rounded-lg overflow-hidden relative flex items-center justify-center shadow-sm group-hover:shadow-2xl transition-all duration-700">
                        {p.media ? (
                            <img src={p.media} alt={p.title} className="max-w-[90%] h-auto drop-shadow-xl transition-transform duration-700 group-hover:scale-105" />
                        ) : (
                            <div className="w-full h-full bg-gradient-to-tr from-gray-50 to-white flex flex-col items-center justify-center space-y-4">
                                <div className="shimmer w-32 h-2 rounded-full opacity-50" />
                                <div className="shimmer w-24 h-2 rounded-full opacity-30" />
                                <span className="text-[9px] uppercase tracking-widest text-gray-300 mt-4 italic">Liquid Memory State</span>
                            </div>
                        )}
                        
                        {p.href && (
                            <div className="absolute bottom-6 right-6">
                                <div className="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity transform translate-y-2 group-hover:translate-y-0">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                                </div>
                            </div>
                        )}
                    </div>
                </a>

                <div className="mt-8 px-2 flex justify-between items-start">
                    <div>
                        <h3 className="text-xl font-normal tracking-tight">{p.title}</h3>
                        <p className="text-sm text-gray-400 font-light mt-1 italic">{p.subtitle}</p>
                        <div className="flex gap-2 mt-4">
                            {p.tools.map(t => <span key={t} className="tag-pill">{t}</span>)}
                        </div>
                    </div>
                    <div className="text-right">
                        <span className="text-[10px] text-gray-300 uppercase tracking-widest">{p.tag}</span>
                    </div>
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
