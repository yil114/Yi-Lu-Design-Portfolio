<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        *, ::before, ::after { box-sizing: border-box; }

        body {
            background-color: rgb(255, 255, 255);
            font-family: Inter, sans-serif;

        .reveal {

        .content-section { margin-bottom: 100px; }

        .tag-pill {

            padding: 4px 12px;
            border-radius: 999px;
            text-transform: uppercase;

        .tag-pill:hover { border-color: rgb(26, 26, 26); color: rgb(26, 26, 26); }

        .img-wrapper {
            position: relative;
            width: 100%;
            padding: 40px;
            background: rgb(249, 250, 251);
            border-radius: 12px;
        }
        .img-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .stat-block {
            padding-top: 32px;
        }

        .stat-number {
            font-size: 3rem;
            line-height: 1;
            color: rgb(17, 24, 39);
            font-weight: 600 !important;
        }

        .callout-box {
            background: rgb(248, 249, 250);
            border-left: 2px solid rgb(26, 26, 26);
            padding: 24px 28px;
            border-radius: 0px 12px 12px 0px;
        }

        .hmw-box {
            background: rgb(26, 26, 26);
            color: rgb(255, 255, 255);
            border-radius: 16px;
            padding: 40px;
            margin: 40px 0px;
        }

        .persona-box {
            border: 1px solid rgb(229, 231, 235);
            border-radius: 16px;
            padding: 32px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .persona-box:hover {
            border-color: rgb(209, 213, 219);
            box-shadow: rgba(0, 0, 0, 0.05) 0px 4px 20px;
        }

        .takeaway-item {
            display: flex;
            gap: 16px;
            align-items: flex-start;
            padding: 24px 0px;

        .takeaway-item:hover { padding-left: 8px; }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: rgb(107, 114, 128);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: block;
        }

        .iter-badge {
            font-size: 11px;
            font-weight: 600;
            color: rgb(107, 114, 128);
            border: 1px solid rgb(229, 231, 235);
            border-radius: 6px;
            padding: 4px 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: rgb(249, 250, 251);
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: rgb(156, 163, 175);
            text-decoration: none;
            margin-bottom: 80px;
            transition: color 0.2s, gap 0.25s;
        }
        .back-link svg { transition: transform 0.25s; }
        .back-link:hover { color: rgb(26, 26, 26); gap: 8px; }
        .back-link:hover svg { transform: translateX(-4px); }

        .footer-next {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: rgb(156, 163, 175);
            text-decoration: none;
            transition: color 0.2s, letter-spacing 0.3s;
        }
        .footer-next:hover { color: rgb(26, 26, 26); letter-spacing: 0.42em; }

        .rc-label {
            font-size: 13px;
            font-weight: 600;
            color: rgb(107, 114, 128);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
            display: block;
        }

        .rc-h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: #111827;
            line-height: 1.25;
            margin-top: 10px;
            margin-bottom: 16px;
            max-width: 52rem;
        }

        .rc-h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: rgb(17, 24, 39);
            line-height: 1.4;
            margin-top: 10px;
            margin-bottom: 12px;
        }

        .rc-body {
            font-size: 15px;
            font-weight: 400;
            color: #6b7280;
            line-height: 1.75;
            max-width: 42rem;
            display: block;
        }

        .rc-body strong { color: rgb(17, 24, 39); font-weight: 600; }

        .pull-quote {
            border-left: 2px solid rgb(26, 26, 26);
            padding: 20px 28px;

        }
        .pull-quote p {
            font-size: 1.1rem;
            font-style: italic;
            font-weight: 400;
            color: rgb(55, 65, 81);

        }

        @media (max-width: 768px) { .stat-number { font-size: 2.25rem; } }

        .fc-btn {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid rgb(229,231,235); background: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            transition: border-color .2s, background .2s;
        }
        .fc-btn:hover { border-color: rgb(26,26,26); background: rgb(26,26,26); }
        .fc-btn:hover svg { stroke: white; }
        @keyframes fcFade { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>
    <div id="scroll-progress"></div>
    <div id="root"></div>

    <script type="text/babel">
    const { useEffect, useRef, useState } = React;

    function Reveal({ children, delay = 0, className = '' }) {
        const ref = useRef(null);
        useEffect(() => {
            const obs = new IntersectionObserver(([e]) => {
                if (e.isIntersecting) { e.target.classList.add('visible'); obs.disconnect(); }
            }, { threshold: 0.07 });
            if (ref.current) obs.observe(ref.current);
            return () => obs.disconnect();
        }, []);
        return (
            <div ref={ref} className={`reveal ${className}`} style={{ transitionDelay: `${delay}s` }}>
                {children}
            </div>
        );
    }

    function useCounter(target, duration, active) {
        const [val, setVal] = useState(0);
        const started = useRef(false);
        useEffect(() => {
            if (!active || started.current) return;
            started.current = true;
            const numeric = parseFloat(String(target).replace(/[^0-9.]/g, ''));
            const t0 = performance.now();
            const tick = now => {
                const p = Math.min((now - t0) / duration, 1);
                const ease = 1 - Math.pow(1 - p, 3);
                setVal(Math.round(ease * numeric * 10) / 10);
                if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }, [active]);
        return val;
    }

    function StatCard({ prefix = '', value, suffix = '', label, description, delay = 0 }) {
        const ref = useRef(null);
        const [active, setActive] = useState(false);
        const count = useCounter(value, 1500, active);
        useEffect(() => {
            const obs = new IntersectionObserver(([e]) => {
                if (e.isIntersecting) { setActive(true); obs.disconnect(); }
            }, { threshold: 0.4 });
            if (ref.current) obs.observe(ref.current);
            return () => obs.disconnect();
        }, []);
        const display = active ? (Number.isInteger(value) ? Math.round(count) : count) : 0;
        return (
            <div ref={ref} className="stat-block reveal" style={{ transitionDelay: `${delay}s` }}>
                <p className="stat-number">{prefix}{display}{suffix}</p>
                <p className="rc-label mt-3 mb-1">{label}</p>
                <p className="text-xs text-gray-500 font-normal leading-relaxed">{description}</p>
            </div>
        );
    }

    function CaseImg({ src, alt, caption }) {
        return (
            <div className="img-wrapper">
                <img src={src} alt={alt} />
                {caption && <div className="img-caption">{caption}</div>}
            </div>
        );
    }

    function FieldCarousel({ images }) {
        const [idx, setIdx] = useState(0);
        const n = images.length;
        const CARD = 220;
        const GAP  = 12;
        const offset = -(idx * (CARD + GAP));

        return (
            <div style={{ marginTop: 20 }}>
                {/* Track wrapper — arrows sit inside so they stay visible */}
                <div style={{ position: 'relative', borderRadius: 10, overflow: 'hidden' }}>
                    {/* Sliding track */}
                    <div style={{
                        display: 'flex', gap: GAP,
                        transform: `translateX(${offset}px)`,
                        transition: 'transform .45s cubic-bezier(.16,1,.3,1)',
                        willChange: 'transform',
                    }}>
                        {images.map((src, i) => (
                            <div key={i} style={{ flex: '0 0 ' + CARD + 'px', borderRadius: 8, overflow: 'hidden', background: '#f3f4f6' }}>
                                <img src={src} alt={'Field Study ' + (i + 1)}
                                    style={{ width: CARD, height: 160, objectFit: 'cover', display: 'block' }} />
                            </div>
                        ))}
                    </div>

                    {/* Left arrow */}
                    <button onClick={() => setIdx(i => (i - 1 + n) % n)} style={{
                        position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)',
                        width: 32, height: 32, borderRadius: '50%', border: 'none',
                        background: 'rgba(255,255,255,0.9)', backdropFilter: 'blur(4px)',
                        boxShadow: '0 1px 4px rgba(0,0,0,0.15)', cursor: 'pointer',
                        display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2,
                    }}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>

                    {/* Right arrow */}
                    <button onClick={() => setIdx(i => (i + 1) % n)} style={{
                        position: 'absolute', right: 10, top: '50%', transform: 'translateY(-50%)',
                        width: 32, height: 32, borderRadius: '50%', border: 'none',
                        background: 'rgba(255,255,255,0.9)', backdropFilter: 'blur(4px)',
                        boxShadow: '0 1px 4px rgba(0,0,0,0.15)', cursor: 'pointer',
                        display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 2,
                    }}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>

                {/* Dots */}
                <div style={{ display: 'flex', justifyContent: 'center', gap: 7, marginTop: 14 }}>
                    {images.map((_, i) => (
                        <button key={i} onClick={() => setIdx(i)} style={{
                            height: 7, width: i === idx ? 22 : 7, borderRadius: 999,
                            background: i === idx ? 'rgb(26,26,26)' : 'rgb(209,213,219)',
                            border: 'none', cursor: 'pointer', padding: 0,
                            transition: 'width .25s, background .25s',
                        }} />
                    ))}
                </div>
            </div>
        );
    }

    function CaseStudyPage() {
        const [activeSection, setActiveSection] = useState('overview');

        const navItems = [
            { label: "Design Challenge", id: "design-challenge" },
            { label: "Process",          id: "process" },
            { label: "UX Research",         id: "discover" },
            { label: "User Pain Points",           id: "define" },
            { label: "User Persona",          id: "diverge" },
            { label: "Wireframes",          id: "develop" },
            { label: "High Fidelity Prototypes",          id: "deliver" },
            { label: "Learnings",        id: "learnings" },
        ];


        const base = "https://images.squarespace-cdn.com/content/v1/68d5a437b484267b9999188c/";
        const img = {
            hero:         base + "bcc691a4-ec61-4f87-90ec-0953db3bc68b/Volvo+Watch+Poster.png",
            mentorGoals:  base + "96eff670-aae5-47ee-893a-d0629ac7dff2/Michael%27s+Goals.png",
            fieldStudy:   base + "679757f1-d6b1-4762-a217-6a938011732a/field+study.png",
            competitive:  base + "6168c859-c8c8-47ff-8408-d3f534c7fca9/competitive+analysis.png",
            painPoints:   base + "61507cff-a91f-442f-965c-9be70902b69f/Drivers%27+Pain+Points.png",
            volvoBrand:   base + "86be4dcd-4ee4-47c5-b45a-38ed8be8cfef/All-new+Volvo+VNR+Grille.jpg",
            driver:       base + "56a10bd5-a2a5-427a-aff7-6e95d76fdb97/All-new+Volvo+VNL+Driver-10.jpg",
            smartwatch:   base + "ce6f4061-ccf6-4ee5-9b9b-49fbc9ce59eb/Smartwatch.png",
            screenshot1:  base + "6a63a4cd-ba33-41f8-8e96-27b050d4b392/Screenshot+2025-11-12+at+6.14.28+PM.png",
            screenshot2:  base + "6be47395-1a8f-4c81-af75-37baac34d32a/Screenshot+2025-11-12+at+6.14.18+PM.png",
            internCohort: base + "8cd5a90c-ef59-4b82-a6c2-ebf1fe87245f/Volvo+Intern+Cohort.png",
        };

        useEffect(() => {
            const ids = navItems.map(n => n.id);
            const onScroll = () => {
                const doc = document.documentElement;
                const pct = doc.scrollTop / (doc.scrollHeight - doc.clientHeight);
                const bar = document.getElementById('scroll-progress');
                if (bar) bar.style.width = (pct * 100) + '%';
                let cur = ids[0];
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el && window.scrollY >= el.offsetTop - 180) cur = id;
                });
                setActiveSection(cur);
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            return () => window.removeEventListener('scroll', onScroll);
        }, []);

        return (
            <div className="page-wrapper min-h-screen">
                <div className="flex px-8 py-12 md:px-16 md:py-20 lg:px-24">

                    {/* Sidebar */}
                    <aside className="w-[200px] hidden md:block flex-shrink-0 sticky top-12 h-fit pr-10">
                        <nav>
                            <a href="index.html"
                               onClick={e => { e.preventDefault(); window.location.href = 'index.html'; }}
                               className="back-link">
                                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                </svg>
                                Back to projects
                            </a>
                            <div className="mb-16">
                                <span className="text-xs uppercase text-gray-400 tracking-[0.1em]">Internship · 2025</span>
                                <h1 className="text-base font-semibold text-gray-900 mt-1">Volvo Group</h1>
                            </div>
                            <ul className="space-y-6">
                                {navItems.map(item => (
                                    <li key={item.id}>
                                        <a href={`#${item.id}`}
                                           className={`nav-link text-[10px] tracking-[0.12em] uppercase text-gray-400 ${activeSection === item.id ? 'active' : ''}`}>
                                            {item.label}
                                        </a>
                                    </li>
                                ))}
                            </ul>
                        </nav>
                    </aside>

                    {/* Main */}
                    <main className="flex-grow min-w-0">

                        {/* ── Header ── */}
                        <header className="mb-16">
                            <Reveal>
                                <p className="rc-label mb-3">Volvo Group · Internship 2025</p>
                                <h2 className="text-4xl md:text-5xl font-semibold text-gray-900 leading-tight mb-4">
                                    Translating an ambiguous problem into an AI product for 2.5M+ drivers
                                </h2>
                            </Reveal>
                        </header>

                        {/* ── META GRID ── */}
                        <Reveal>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-8 mb-14 pb-14 border-b border-gray-100">
                                {[
                                    { label: "Role", lines: ["UX Design &", "Research Intern"] },
                                    { label: "Timeline", lines: ["Summer 2025"] },
                                    { label: "Team", lines: ["1 Design Director", "1 Designer (me)"] },
                                    { label: "Skills", lines: ["UX Design", "User Research", "Wearables", "AI Product"] },
                                ].map((col, i) => (
                                    <div key={i}>
                                        <p className="rc-label mb-2">{col.label}</p>
                                        {col.lines.map((l, j) => (
                                            <p key={j} className="text-sm font-normal text-gray-500 leading-relaxed">{l}</p>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </Reveal>

                        {/* ── Design Challenge ── */}
                        <section id="design-challenge" className="content-section">
                            <Reveal><span className="section-label">Background / Design Challenge</span></Reveal>
                            <Reveal delay={0.05}>
                                <h2 className="rc-h2 mb-4">The Design Studio wanted to innovate and lead with tech — but wasn't sure how or where to go next.</h2>
                                <p className="rc-body mb-10">Completed during an internship at Volvo Trucks North America. My mentor presented four opportunity areas and gave me the freedom to pursue any direction — an open canvas that was both exciting and daunting.</p>
                            </Reveal>
                            <Reveal delay={0.05}>
                                <CaseImg src="Images/Volvo/Volvo Problem Statement.png" alt="Volvo Problem Statement — four opportunity areas" />
                            </Reveal>
                        </section>

                        {/* ── Process ── */}
                        <section id="process" className="content-section">
                            <Reveal><span className="section-label">Process — Double Diamond</span></Reveal>
                            <Reveal delay={0.05}>
                                <h2 className="rc-h2 mb-4">I wasn't sure where to start — so I let the users lead the way.</h2>
                                <p className="rc-body mb-10">I decided to take a user-centered approach: begin by deeply understanding the people we were designing for, what challenges they were experiencing, and how we could better support them.</p>
                            </Reveal>
                            <Reveal delay={0.05}>
                               
                                <CaseImg src="Images/Volvo/Design Process.png" alt="Double Diamond Design Process" />
                            </Reveal>
                        </section>

                        {/* ── Discover ── */}
                        <section id="discover" className="content-section">
                            <Reveal><span className="section-label">Discover</span></Reveal>
                            <Reveal delay={0.05}>
                                <h2 className="rc-h2 mb-10">Three methods to build a grounded picture of the driver's world.</h2>
                            </Reveal>

                            <Reveal delay={0.05} className="mb-12">
                                <div className="stat-block pt-6">
                                    <span className="iter-badge mb-3" style={{ display: 'inline-block' }}>1. Field Study</span>
                                    <p className="rc-body mb-8">Highway driving, trailer pickup, long hauls. I experienced what it actually felt like to be behind the wheel before forming any design assumptions.</p>
                                    <FieldCarousel images={[
                                        "Images/Volvo/field study 1.png",
                                        "Images/Volvo/field study 2.png",
                                        "Images/Volvo/field study 3.png",
                                        "Images/Volvo/field study 4.png",
                                        "Images/Volvo/field study 5.png",
                                        "Images/Volvo/field study 6.png",
                                    ]} />
                                </div>
                            </Reveal>

                            <Reveal delay={0.05} className="mb-12">
                                <div className="stat-block pt-6">
                                    <span className="iter-badge mb-3" style={{ display: 'inline-block' }}>2. Secondary Research</span>
                                    <h3 className="rc-h3 mb-2">Validated field observations via social media platforms.</h3>
                                    <p className="rc-body mb-8">TikTok, YouTube, Reddit, Instagram, and Facebook. Key finding: <strong>drivers commonly skip the legally required pre-trip inspection</strong> — a significant safety and compliance gap.</p>
                                    <CaseImg src="Images/Volvo/Secondary Research.png" alt="Secondary Research findings" />
                                </div>
                            </Reveal>

                            <Reveal delay={0.05}>
                                <div className="stat-block pt-6">
                                    <span className="iter-badge mb-3" style={{ display: 'inline-block' }}>3. Competitive Analysis</span>
                                    <h3 className="rc-h3 mb-2">Analyzed 12+ transportation companies to map the in-vehicle HMI landscape.</h3>
                                    <p className="rc-body mb-8">Volvo, Freightliner, Kenworth, Peterbilt, Western Star, BYD, and others across North America and China — identifying where the industry stood on in-cab technology.</p>
                                    <CaseImg src="Images/Volvo/Competitive benchmarking.png" alt="Competitive benchmarking analysis" />
                                </div>
                            </Reveal>
                        </section>

                        {/* ── Define ── */}
                        <section id="define" className="content-section">
                            <Reveal><span className="section-label">Define</span></Reveal>
                            <Reveal delay={0.05}>
                                <h2 className="rc-h2 mb-4">Research Insights — 3 Core Pain Points</h2>
                                <p className="rc-body mb-10">Three consistent themes emerged across every source — each pointing to the same underlying gap: trucking technology has not kept pace with the people who depend on it.</p>
                            </Reveal>

                            <div className="space-y-0 mb-14">
                                {[
                                    {
                                        label: "Pain Point 1",
                                        title: "Manual Task Overload",
                                        body: "Drivers juggle logging hours, vehicle inspection reports, delivery documentation, shipment status updates, and dispatch coordination — all manually, often while on the road."
                                    },
                                    {
                                        label: "Pain Point 2",
                                        title: "Safety & Wellbeing",
                                        body: "11.9 average daily driving hours. 39.5% rarely or never get adequate sleep. 54.9% have driven while dangerously fatigued. The human cost is severe and under-addressed."
                                    },
                                    {
                                        label: "Pain Point 3",
                                        title: "Technology Lag",
                                        body: "While autonomous driving, voice assistants, and mobile integration are standard in consumer auto, trucking has significantly lagged in adoption — leaving drivers without tools that could meaningfully reduce their load."
                                    },
                                ].map((item, i) => (
                                    <Reveal key={i} delay={i * 0.08}>
                                        <div className="takeaway-item">
