<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yi Lu | About</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafafa;
            --ink: #1a1a1a;
            --mid: #9ca3af;
            --accent: #1a1a1a;
            --paper: #ffffff;
            --paper2: #f4f4f5;
            --blue-note: #dbeafe;
            --yellow-note: #fef9c3;
            --pink-note: #fce7f3;
            --green-note: #dcfce7;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            cursor: none;
            overflow: hidden;
            height: 100vh;
        }

        /* ── Cursor ── */
        #cur {
            width: 8px; height: 8px; background: var(--ink);
            border-radius: 50%; position: fixed; top:0; left:0;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%,-50%);
            transition: width .15s, height .15s, background .15s;
        }
        #cur-ring {
            width: 30px; height: 30px;
            border: 1px solid rgba(26,26,26,.2); border-radius: 50%;
            position: fixed; top:0; left:0;
            pointer-events: none; z-index: 9998;
            transform: translate(-50%,-50%);
            transition: width .35s cubic-bezier(.23,1,.32,1), height .35s cubic-bezier(.23,1,.32,1);
        }
        body.dragging #cur { width: 14px; height: 14px; background: var(--ink); border-radius: 3px; transform: translate(-50%,-50%) rotate(45deg); }
        body.dragging #cur-ring { width: 0; height: 0; }
        body.hovcard #cur { width: 5px; height: 5px; }
        body.hovcard #cur-ring { width: 48px; height: 48px; border-color: rgba(156,163,175,.4); }


        
        /* ── Nav ── */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 6000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 24px 48px;
            background: rgba(250,250,250,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(229,231,235,0.8);
        }
        .nav-brand { display: flex; flex-direction: column; }
        .nb-name {
            font-size: 15px; font-weight: 700;
            letter-spacing: .05em; color: var(--ink);
            text-transform: uppercase; text-decoration: none;
        }
        .nb-sub {
            font-size: 11px; font-weight: 300;
            letter-spacing: .1em; color: var(--mid);
            text-transform: uppercase; margin-top: 3px;
        }
        .nav-center {
            display: flex; gap: 48px; align-items: center;
            position: absolute; left: 50%; transform: translateX(-50%);
        }
        .nav-link {
            font-size: 13px; font-weight: 300; letter-spacing: .08em;
            color: var(--mid); text-decoration: none; text-transform: uppercase;
            transition: color .2s;
        }
        .nav-link:hover, .nav-link.on { color: var(--ink); }
        .nav-icons { display: flex; gap: 22px; align-items: center; }
        .nav-icon { color: var(--mid); transition: color .2s; }
        .nav-icon:hover { color: var(--ink); }

        /* ── Canvas ── */
        #canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: auto;
            padding-top: 72px;
        }
        #board {
            position: relative;
            width: 2200px;
            height: 1800px;
        }

        /* ── Hint ── */
        .hint {
            position: fixed;
            bottom: 28px; left: 50%;
            transform: translateX(-50%);
            z-index: 5000;
            display: flex; align-items: center; gap: 8px;
            font-size: 11px; letter-spacing: .15em; text-transform: uppercase;
            color: var(--mid);
            background: rgba(250,250,250,0.9);
            backdrop-filter: blur(12px);
            padding: 8px 20px; border-radius: 999px;
            border: 1px solid rgba(229,231,235,0.8);
            animation: hintPulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes hintPulse {
            0%,100%{opacity:.6} 50%{opacity:1}
        }

        /* ── Base draggable card ── */
        .card {
            position: absolute;
            user-select: none;
            touch-action: none;
            will-change: transform;
            transition: box-shadow .2s;
        }
        .card:hover { z-index: 100; }
        .card.is-dragging {
            z-index: 999 !important;
            box-shadow: 0 24px 80px rgba(26,24,20,.22) !important;
            transition: none;
        }

        /* ── Polaroid ── */
        .polaroid {
            background: var(--paper);
            padding: 14px 14px 48px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
        }
        .polaroid img {
            width: 100%; display: block;
            object-fit: cover;
            pointer-events: none;
        }
        .polaroid .pol-caption {
            font-family: 'Inter', sans-serif;
            font-size: 12px; font-weight: 300; letter-spacing: .06em;
            color: var(--mid);
            text-align: center; padding-top: 10px;
        }
        .polaroid::before {
            content: '';
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 20px; height: 20px;
            background: rgba(156,163,175,0.5);
            border-radius: 50%;
            box-shadow: 0 2px 4px rgba(0,0,0,.15);
        }

        /* ── Sticky note ── */
        .sticky {
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
            font-family: 'Inter', sans-serif;
        }
        .sticky::after {
            content: '';
            position: absolute; bottom: 0; right: 0;
            width: 24px; height: 24px;
            background: rgba(0,0,0,.06);
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }
        .sticky-title {
            font-size: 13px; font-weight: 600; letter-spacing: .04em;
            color: var(--ink); margin-bottom: 10px; line-height: 1.3;
        }
        .sticky-body {
            font-size: 12px; font-weight: 400; color: #52525b; line-height: 1.6;
        }
        .sticky-list { list-style: none; }
        .sticky-list li { font-size: 12px; color: #52525b; padding: 3px 0; }
        .sticky-list li::before { content: '— '; color: var(--mid); }

        /* ── Tag chip ── */
        .tag-chip {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
            color: var(--mid); border: 1px solid rgba(229,231,235,0.8);
            padding: 4px 12px; border-radius: 999px;
            background: rgba(255,255,255,0.7);
            margin: 3px;
        }

        /* ── Washi tape ── */
        .washi {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-2deg);
            width: 80px; height: 28px;
            border-radius: 3px;
            opacity: 0.85;
        }

        /* ── Big name card ── */
        .name-card {
            background: var(--ink);
            color: var(--paper);
            padding: 40px 44px;
            box-shadow: 0 8px 40px rgba(0,0,0,.12);
        }
        .name-card .nc-eye {
            font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
            color: #9ca3af; margin-bottom: 16px; display: block;
        }
        .name-card .nc-name {
            font-family: 'Inter', sans-serif;
            font-size: 3.5rem; font-weight: 300; line-height: 1; letter-spacing: -.03em;
            margin-bottom: 4px;
        }
        .name-card .nc-name em { font-style: normal; font-weight: 700; color: #ffffff; }
        .name-card .nc-role {
            font-size: 13px; font-weight: 300;
            color: rgba(255,255,255,0.4); letter-spacing: .08em;
            text-transform: uppercase; margin-top: 12px;
        }
        .name-card .nc-bio {
            font-size: 13px; font-weight: 300;
            color: rgba(255,255,255,0.6); line-height: 1.75;
            margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 20px;
        }
        .name-card .nc-bio a {
            color: rgba(255,255,255,0.9); text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* ── String/thread connector (decorative) ── */
        svg.threads {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Tape strip on photos ── */
        .tape {
            position: absolute; top: -8px; left: 50%;
            transform: translateX(-50%);
            width: 64px; height: 20px;
            background: rgba(209,213,219,0.55);
            border-radius: 2px;
        }

        /* ── Mini stat card ── */
        .stat-mini {
            background: var(--paper);
            padding: 20px 24px;
            box-shadow: 0 3px 16px rgba(0,0,0,.06);
            text-align: center;
        }
        .stat-mini .sm-num {
            font-family: 'Inter', sans-serif;
            font-size: 2.4rem; font-weight: 300; color: var(--ink); line-height: 1;
        }
        .stat-mini .sm-lbl {
            font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
            color: var(--mid); margin-top: 6px;
            font-family: 'Inter', sans-serif;
        }

        /* ── Scroll reset button ── */
        .reset-btn {
            position: fixed; bottom: 28px; right: 32px; z-index: 5000;
            font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
            color: var(--mid); background: rgba(250,250,250,0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(229,231,235,0.8);
            padding: 8px 18px; border-radius: 999px;
            cursor: none; transition: all .2s;
        }
        .reset-btn:hover { color: var(--ink); border-color: var(--ink); }
    </style>
</head>
<body>
    <div id="cur"></div>
    <div id="cur-ring"></div>
    <div id="root"></div>

    <script type="text/babel">
    const { useEffect, useRef, useState, useCallback } = React;

    const base = "https://images.squarespace-cdn.com/content/v1/68d5a437b484267b9999188c/";
    const photos = {
        donNorman:   base + "49e3cd30-7850-4d56-951e-012f4b2125ef/Yi+chatting+with+Don+Norman.png",
        portrait1:   base + "df394353-3e23-4ad9-9f13-ba6630e81c56/IMG_9331.png",
        outdoors:    base + "0f8d2216-2654-445c-9db7-54ccacf52d4f/Yi+at+great+somky.png",
        portrait2:   base + "10cf051a-48d1-441a-8e91-c25a2f8c2cb3/IMG_9333.PNG",
        teamWork:    base + "07dec1fe-91ac-4ca0-ab09-3b02a727c34c/Screen%2BShot%2B2023-01-18%2Bat%2B4.47.28%2BPM.png",
        nightMarket: base + "7d54492b-4231-4663-9d6c-373f3ffd95a2/MASA_Night%2BMarket.JPG",
    };

    /* ── Draggable hook ── */
    function useDraggable(initX, initY) {
        const [pos, setPos] = useState({ x: initX, y: initY });
        const [dragging, setDragging] = useState(false);
        const ref = useRef(null);
        const drag = useRef({ startX: 0, startY: 0, ox: initX, oy: initY });

        const onMouseDown = useCallback(e => {
            e.preventDefault();
            drag.current = { startX: e.clientX, startY: e.clientY, ox: pos.x, oy: pos.y };
            setDragging(true);
            document.body.classList.add('dragging');

            const onMove = e => {
                const dx = e.clientX - drag.current.startX;
                const dy = e.clientY - drag.current.startY;
                setPos({ x: drag.current.ox + dx, y: drag.current.oy + dy });
            };
            const onUp = () => {
                setDragging(false);
                document.body.classList.remove('dragging');
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('mouseup', onUp);
            };
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
        }, [pos]);

        return { pos, dragging, onMouseDown };
    }

    /* ── Polaroid card ── */
    function Polaroid({ src, caption, initX, initY, rot = 0, width = 200, imgH = 200, zBase = 10 }) {
        const { pos, dragging, onMouseDown } = useDraggable(initX, initY);
        const [z, setZ] = useState(zBase);

        return (
            <div
                className={`card polaroid ${dragging ? 'is-dragging' : ''}`}
                onMouseDown={onMouseDown}
                onMouseEnter={() => { setZ(50); document.body.classList.add('hovcard'); }}
                onMouseLeave={() => { setZ(zBase); document.body.classList.remove('hovcard'); }}
                style={{
                    left: pos.x, top: pos.y,
                    transform: `rotate(${dragging ? rot * 0.3 : rot}deg)`,
                    width, zIndex: z,
                    borderRadius: 4,
                    cursor: dragging ? 'grabbing' : 'grab',
                    transition: dragging ? 'box-shadow .2s' : 'box-shadow .2s, transform .3s cubic-bezier(.23,1,.32,1)',
                }}
            >
                <div className="tape"></div>
                <img src={src} alt={caption} style={{ height: imgH, objectFit: 'cover' }} />
                <div className="pol-caption">{caption}</div>
            </div>
        );
    }

    /* ── Sticky note ── */
    function StickyNote({ color, title, children, initX, initY, rot = 0, width = 220, zBase = 10 }) {
        return (
            <div
                className="sticky"
                style={{
                    position: 'absolute',
                    left: initX, top: initY,
                    transform: `rotate(${rot}deg)`,
                    width, zIndex: zBase,
                    background: color,
                    borderRadius: 2,
                    cursor: 'default',
                    userSelect: 'none',
                    pointerEvents: 'none',
                }}
            >
                {title && <div className="sticky-title">{title}</div>}
                {children}
            </div>
        );
    }

    /* ── Name/bio card ── */
    function NameCard({ initX, initY, zBase = 5 }) {
        const { pos, dragging, onMouseDown } = useDraggable(initX, initY);
        const [z, setZ] = useState(zBase);
        return (
            <div
                className={`card name-card ${dragging ? 'is-dragging' : ''}`}
                onMouseDown={onMouseDown}
                onMouseEnter={() => { setZ(50); document.body.classList.add('hovcard'); }}
                onMouseLeave={() => { setZ(zBase); document.body.classList.remove('hovcard'); }}
                style={{
                    left: pos.x, top: pos.y,
                    width: 360, zIndex: z,
                    borderRadius: 6,
                    cursor: dragging ? 'grabbing' : 'grab',
                    transition: dragging ? 'box-shadow .2s' : 'box-shadow .2s',
                }}
            >
                <span className="nc-eye">Product Designer · NYC</span>
                <div className="nc-name">Hi, I'm <em>Yi</em></div>
                <div className="nc-role">UX Design & Research</div>
                <p className="nc-bio">
                    Started designing at the Don Norman funded{' '}
                    <a href="https://designlab.ucsd.edu" target="_blank" rel="noopener noreferrer">Design Lab</a>{' '}
                    @ UC San Diego. I love connecting with people, observing how they interact with the world, and making experiences better.
                </p>
            </div>
        );
    }

    /* ── Stat mini ── */
    function StatCard({ num, suffix = '', label, initX, initY, rot = 0, zBase = 10 }) {
        const { pos, dragging, onMouseDown } = useDraggable(initX, initY);
        const [z, setZ] = useState(zBase);
        return (
            <div
                className={`card stat-mini ${dragging ? 'is-dragging' : ''}`}
                onMouseDown={onMouseDown}
                onMouseEnter={() => { setZ(50); document.body.classList.add('hovcard'); }}
                onMouseLeave={() => { setZ(zBase); document.body.classList.remove('hovcard'); }}
                style={{
                    left: pos.x, top: pos.y,
                    transform: `rotate(${dragging ? rot * 0.3 : rot}deg)`,
                    width: 130, zIndex: z,
                    borderRadius: 6,
                    cursor: dragging ? 'grabbing' : 'grab',
                    transition: dragging ? 'box-shadow .2s' : 'box-shadow .2s, transform .3s cubic-bezier(.23,1,.32,1)',
                }}
            >
                <div className="tape"></div>
                <div className="sm-num">{num}{suffix}</div>
                <div className="sm-lbl">{label}</div>
            </div>
        );
    }

    /* ── Video card (polaroid-style, draggable) ── */
    function VideoCard({ src, caption, initX, initY, rot = 0, width = 280, videoH = 220, zBase = 10 }) {
        const { pos, dragging, onMouseDown } = useDraggable(initX, initY);
        const [z, setZ] = useState(zBase);
        const videoRef = useRef(null);
        const [playing, setPlaying] = useState(false);

        function togglePlay(e) {
            e.stopPropagation();
            if (!videoRef.current) return;
            if (playing) {
                videoRef.current.pause();
                setPlaying(false);
            } else {
                videoRef.current.play();
                setPlaying(true);
            }
        }

        return (
            <div
                className={`card polaroid ${dragging ? 'is-dragging' : ''}`}
                onMouseDown={onMouseDown}
                onMouseEnter={() => { setZ(50); document.body.classList.add('hovcard'); }}
                onMouseLeave={() => { setZ(zBase); document.body.classList.remove('hovcard'); }}
                style={{
                    left: pos.x, top: pos.y,
                    transform: `rotate(${dragging ? rot * 0.3 : rot}deg)`,
                    width, zIndex: z,
                    borderRadius: 4,
                    cursor: dragging ? 'grabbing' : 'grab',
                    transition: dragging ? 'box-shadow .2s' : 'box-shadow .2s, transform .3s cubic-bezier(.23,1,.32,1)',
                }}
            >
                <div className="tape"></div>
                <div style={{ width: '100%', height: videoH, background: '#0a0a0a', overflow: 'hidden', position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <video
                        ref={videoRef}
                        src={src}
                        loop
                        playsInline
                        onEnded={() => setPlaying(false)}
                        style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block', pointerEvents: 'none' }}
                    />
                    <button
                        onClick={togglePlay}
                        style={{
                            position: 'absolute',
                            inset: 0,
                            width: '100%',
                            height: '100%',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            background: 'transparent',
                            border: 'none',
                            cursor: 'pointer',
                            opacity: playing ? 0 : 1,
                            transition: 'opacity .2s',
                        }}
                        onMouseEnter={e => e.currentTarget.style.opacity = 1}
                        onMouseLeave={e => e.currentTarget.style.opacity = playing ? 0 : 1}
                    >
                        <div style={{
                            width: 44, height: 44,
                            borderRadius: '50%',
                            background: 'rgba(255,255,255,0.15)',
                            backdropFilter: 'blur(8px)',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            border: '1px solid rgba(255,255,255,0.3)',
                        }}>
                            {playing
                                ? <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                                : <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
                            }
                        </div>
                    </button>
                </div>
                <div className="pol-caption">{caption}</div>
            </div>
        );
    }

    /* ── Draggable tag chip ── */
    function DragTag({ label, initX, initY, rot = 0 }) {
        const { pos, dragging, onMouseDown } = useDraggable(initX, initY);
        return (
            <div className="card tag-chip"
                onMouseDown={onMouseDown}
                onMouseEnter={() => document.body.classList.add('hovcard')}
                onMouseLeave={() => document.body.classList.remove('hovcard')}
                style={{
                    left: pos.x, top: pos.y,
                    transform: `rotate(${dragging ? rot * 0.3 : rot}deg)`,
                    zIndex: dragging ? 999 : 8,
                    cursor: dragging ? 'grabbing' : 'grab',
                    transition: dragging ? 'none' : 'transform .3s',
                    boxShadow: dragging ? '0 8px 24px rgba(26,24,20,.15)' : 'none',
                }}>
                {label}
            </div>
        );
    }

    function App() {
        /* Cursor */
        useEffect(() => {
            const dot  = document.getElementById('cur');
            const ring = document.getElementById('cur-ring');
            let raf, rx = 0, ry = 0, tx = 0, ty = 0;
            const mv = e => { tx = e.clientX; ty = e.clientY; };
            const lerp = (a, b, t) => a + (b - a) * t;
            const loop = () => {
                rx = lerp(rx, tx, 0.2); ry = lerp(ry, ty, 0.2);
                ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
                dot.style.left  = tx + 'px'; dot.style.top  = ty + 'px';
                raf = requestAnimationFrame(loop);
            };
            raf = requestAnimationFrame(loop);
            window.addEventListener('mousemove', mv);
            return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', mv); };
        }, []);

        const resetView = () => {
            const canvas = document.getElementById('canvas');
            if (canvas) { canvas.scrollLeft = 0; canvas.scrollTop = 0; }
        };

        return (
            <div>
                {/* Nav */}
                <nav className="w-full flex items-center justify-between px-6 py-8 md:px-12 bg-[#fafafa]/90 backdrop-blur-md sticky top-0 z-50">
                    <div className="flex flex-col">
                        <span className="text-[15px] font-bold tracking-[0.05em] text-[#1a1a1a] uppercase">Yi Lu</span>
                        <span className="text-[11px] font-light tracking-[0.1em] text-[#9ca3af] uppercase mt-1">Designer & Researcher</span>
                    </div>

                    <div className="hidden md:flex items-center space-x-12 absolute left-1/2 transform -translate-x-1/2">
                        {[['Work', 'index.html'], ['AI Design', 'aidesign.html'], ['About', 'about.html']].map(([item, href]) => (
                            <a
                                key={item}
                                href={href}
                                className={`text-[13px] font-light tracking-[0.08em] transition-colors duration-300 uppercase ${item === 'About' ? 'text-[#1a1a1a]' : 'text-[#9ca3af] hover:text-[#1a1a1a]'}`}
                            >
                                {item}
                            </a>
                        ))}
                    </div>

                    <div className="flex items-center space-x-6">
                        <a href="https://www.linkedin.com/in/yi-lu-b014b31a7/" className="text-[#9ca3af] hover:text-[#1a1a1a] transition-colors duration-300">
